<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="claude:viewport-fit-sides" content="cover">
    <title>Himpunan 50 Doa — PS5 Glass Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.45);
            --card-hover: rgba(30, 41, 59, 0.65);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --neon-blue: #00f0ff;
            --neon-green: #00ff66;
            --border: rgba(255, 255, 255, 0.12);
            --border-focus: rgba(56, 189, 248, 0.6);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            color-scheme: dark;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(30, 27, 75, 0.3) 0px, transparent 100%);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            padding: max(20px, env(safe-area-inset-top, 20px)) max(20px, env(safe-area-inset-right, 20px)) max(20px, env(safe-area-inset-bottom, 20px)) max(20px, env(safe-area-inset-left, 20px));
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.8), rgba(37, 99, 235, 0.8));
            backdrop-filter: blur(10px);
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 25px var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .icon-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.05);
            background: rgba(30, 41, 59, 0.7);
        }

        .search-filter-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .search-bar {
            position: relative;
            width: 100%;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .search-bar input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 25px var(--accent-glow);
            background: rgba(30, 41, 59, 0.6);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .categories-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .cat-chip:hover, .cat-chip.active {
            background: var(--accent);
            color: #030712;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            font-weight: 600;
        }

        .doa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .doa-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .doa-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .doa-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--border-focus);
            box-shadow: 0 20px 40px -10px var(--accent-glow);
            background: var(--card-hover);
        }

        .doa-card:hover::before {
            opacity: 1;
        }

        .doa-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            z-index: 1;
        }

        .doa-title-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .doa-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            backdrop-filter: blur(4px);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            width: fit-content;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .doa-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .doa-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 2;
        }

        .action-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.15);
        }

        .action-btn.active {
            color: #f43f5e;
            border-color: #f43f5e;
            background: rgba(244, 63, 94, 0.2);
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 12px;
            text-align: right;
            direction: rtl;
            line-height: 2.0;
            margin-bottom: 12px;
            color: var(--text);
            padding: 10px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            border-right: 4px solid var(--accent);
            z-index: 1;
            max-height: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rumi-text-card {
            font-size: 9px;
            color: var(--neon-green);
            font-weight: 500;
            margin-bottom: 6px;
            z-index: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-text {
            font-size: 10px;
            color: var(--neon-blue);
            font-weight: 500;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            z-index: 1;
        }

        /* Glass Modal Popup */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 28px;
            width: 100%;
            max-width: 750px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .modal-overlay.open .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .close-modal {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            transition: all 0.2s;
        }

        .close-modal:hover {
            background: #f43f5e;
            border-color: #f43f5e;
            color: white;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.6);
        }

        .modal-arabic {
            font-family: 'Amiri', serif;
            font-size: 16px;
            text-align: right;
            direction: rtl;
            line-height: 2.6;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            border-right: 6px solid var(--accent);
            max-height: 35vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .modal-rumi {
            font-size: 10px;
            color: var(--neon-green);
            font-weight: 500;
            margin-bottom: 12px;
            line-height: 1.6;
            max-height: 20vh;
            overflow-y: auto;
            padding: 12px;
            background: rgba(0, 255, 102, 0.06);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 102, 0.15);
        }

        .modal-malay {
            font-size: 11px;
            color: var(--neon-blue);
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 28px;
            max-height: 25vh;
            overflow-y: auto;
            padding: 12px;
            background: rgba(0, 240, 255, 0.06);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.15);
        }

        .modal-actions {
            display: flex;
            gap: 16px;
        }

        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, var(--accent), #0284c7);
            color: #030712;
            border: none;
            padding: 14px 20px;
            border-radius: 16px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 25px var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #7dd3fc, var(--accent));
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
        }

        .empty-state {
            text-align: center;
            padding: 64px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-state svg {
            width: 56px;
            height: 56px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 300;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <div class="logo-icon">🤲</div>
                <div>
                    <h1>Himpunan 50 Doa</h1>
                    <div class="subtitle">PS5 Glass Edition • Koleksi Doa Terlengkap</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="filterFavBtn" title="Doa Kegemaran">⭐</button>
                <div class="menu-container" style="position: relative;">
                    <button class="icon-btn" id="menuBtn" title="Menu">⋮</button>
                    <div class="dropdown-menu" id="dropdownMenu" style="display: none; position: absolute; right: 0; top: 45px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 1000; min-width: 180px; backdrop-filter: blur(16px); padding: 8px 0;">
                        <a href="#" id="menuAbout" style="display: block; padding: 10px 16px; color: var(--text); text-decoration: none; font-size: 0.9rem; transition: background 0.2s;">ℹ️ Tentang Aplikasi</a>
                        <a href="#" id="menuReset" style="display: block; padding: 10px 16px; color: var(--text); text-decoration: none; font-size: 0.9rem; transition: background 0.2s;">🔄 Reset Kegemaran</a>
                        <a href="https://github.com/nazalab/himpunan-doa" target="_blank" style="display: block; padding: 10px 16px; color: var(--text); text-decoration: none; font-size: 0.9rem; transition: background 0.2s;">🌐 GitHub Repo</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="search-filter-section">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Cari daripada 50 doa...">
            </div>
            <div class="categories-scroll" id="categoriesScroll">
                <button class="cat-chip active" data-cat="Semua">Semua Doa</button>
                <button class="cat-chip" data-cat="Majlis">Doa Majlis & Tahlil</button>
                <button class="cat-chip" data-cat="Solat">Doa Selepas Solat</button>
                <button class="cat-chip" data-cat="Harian">Doa Harian</button>
                <button class="cat-chip" data-cat="Perlindungan">Perlindungan</button>
                <button class="cat-chip" data-cat="Kesihatan">Kesihatan & Ketenangan</button>
                <button class="cat-chip" data-cat="Rezeki">Rezeki & Kejayaan</button>
                <button class="cat-chip" data-cat="Keampunan">Keampunan & Taubat</button>
                <button class="cat-chip" data-cat="Keluarga">Ibu Bapa & Keluarga</button>
            </div>
        </div>

        <div class="doa-grid" id="doaList"></div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p>Tiada doa yang sepadan dengan carian anda.</p>
        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card" id="modalCard">
            <div class="modal-header">
                <div>
                    <span class="doa-badge" id="modalBadge">Kategori</span>
                    <h2 class="modal-title" id="modalTitle">Tajuk Doa</h2>
                </div>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-arabic" id="modalArabic">Arabic</div>
            <div class="modal-rumi"><strong>Rumi:</strong> <span id="modalRumi">Rumi</span></div>
            <div class="modal-malay"><strong>Maksud:</strong> <span id="modalMalay">Malay</span></div>
            <div class="modal-actions">
                <button class="btn-primary" id="modalCopyBtn">📋 Salin Doa</button>
                <button class="btn-primary" id="modalFavBtn" style="background: linear-gradient(135deg, #fbbf24, #d97706); color: #030712;">⭐ Simpan Kegemaran</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Berjaya disalin ke papan keratan!</div>

    <script>
        const duasData = [
            { id: 1, title: "Doa Selamat Lengkap", category: "Majlis", arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ. اَلْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ...", rumi: "Bismillahir rahmanir rahim...", malay: "Dengan nama Allah yang Maha Pemurah lagi Maha Mengasihani..." },
            { id: 2, title: "Doa Tahlil Arwah Lengkap", category: "Majlis", arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ. أَلْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ...", rumi: "Bismillahir rahmanir rahim...", malay: "Segala puji bagi Allah Tuhan semesta alam..." },
            { id: 3, title: "Doa Selepas Solat Fardhu", category: "Solat", arabic: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ. اَلْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ...", rumi: "Bismillahir rahmanir rahim...", malay: "Segala puji bagi Allah Tuhan semesta alam..." },
            { id: 4, title: "Doa Qunut Subuh", category: "Solat", arabic: "اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ...", rumi: "Allahumma-hdini fiman hadait...", malay: "Ya Allah, berikanlah petunjuk kepadaku..." },
            { id: 5, title: "Sayyidul Istighfar", category: "Keampunan", arabic: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ...", rumi: "Allahumma anta rabbi la ilaha illa anta...", malay: "Ya Allah, Engkau adalah Tuhanku..." },
            { id: 6, title: "Doa Dhuha", category: "Rezeki", arabic: "اللَّهُمَّ إِنَّ الضُّحَاءَ ضُحَاءُكَ...", rumi: "Allahumma inna dduha-a dduha-uk...", malay: "Ya Allah, sesungguhnya waktu Dhuha itu dhuha-Mu..." },
            { id: 7, title: "Doa Solat Hajat", category: "Rezeki", arabic: "لَا إِلَهَ إِلَّا اللَّهُ الْحَلِيمُ الْكَرِيمُ...", rumi: "La ilaha illallahul halimul karim...", malay: "Tiada Tuhan selain Allah yang Maha Penyantun..." },
            { id: 8, title: "Doa Kedua Ibu Bapa", category: "Keluarga", arabic: "رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا...", rumi: "Rabbighfir li wa li walidayya warhamhuma...", malay: "Wahai Tuhanku, ampunilah dosaku dan dosa kedua ibu bapaku..." },
            { id: 9, title: "Doa Bangun Tidur", category: "Harian", arabic: "اَلْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا...", rumi: "Alhamdulillahilladzii ahyaana ba'da maa amaatana...", malay: "Segala puji bagi Allah yang telah menghidupkan kami..." },
            { id: 10, title: "Doa Sebelum Makan", category: "Harian", arabic: "اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا...", rumi: "Allahumma baarik lana fiima razaqtana...", malay: "Ya Allah, berkatilah rezeki yang Engkau kurniakan..." },
            { id: 11, title: "Doa Selepas Makan", category: "Harian", arabic: "اَلْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا...", rumi: "Alhamdulillahilladzii ath'amana wa saqana...", malay: "Segala puji bagi Allah yang memberi kami makan dan minum..." },
            { id: 12, title: "Doa Masuk Tandas", category: "Harian", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ", rumi: "Allahumma inni a'udzubika minal khubuthi wal khabaa'ith.", malay: "Ya Allah, aku berlindung dengan-Mu dari syaitan lelaki dan perempuan." },
            { id: 13, title: "Doa Keluar Tandas", category: "Harian", arabic: "غُفْرَانَكَ اَلْحَمْدُ لِلَّهِ الَّذِي أَذْهَبَ عَنِّي الأَذَى", rumi: "Ghufraanak, alhamdulillahilladzii adzhaba 'annil adzaa...", malay: "Aku memohon keampunan-Mu. Segala puji bagi Allah..." },
            { id: 14, title: "Doa Masuk Rumah", category: "Perlindungan", arabic: "بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا...", rumi: "Bismillahi walajna, wa bismillahi kharajna...", malay: "Dengan nama Allah kami masuk, dan dengan nama Allah kami keluar..." },
            { id: 15, title: "Doa Keluar Rumah", category: "Perlindungan", arabic: "بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ...", rumi: "Bismillahi, tawakkaltu 'alallah...", malay: "Dengan nama Allah, aku bertawakal kepada Allah..." },
            { id: 16, title: "Doa Naik Kenderaan", category: "Perlindungan", arabic: "سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ", rumi: "Subhanalladzii sakhkhara lana hadza wa ma kunna lahu muqrinin.", malay: "Maha Suci Allah yang telah memudahkan kenderaan ini..." },
            { id: 17, title: "Doa Masuk Masjid", category: "Harian", arabic: "اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", rumi: "Allahumma-ftah li abwaba rahmatik.", malay: "Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu." },
            { id: 18, title: "Doa Keluar Masjid", category: "Harian", arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", rumi: "Allahumma inni as-aluka min fadlik.", malay: "Ya Allah, sesungguhnya aku memohon kurnia daripada-Mu." },
            { id: 19, title: "Doa Ketenangan Jiwa", category: "Kesihatan", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ", rumi: "Allahumma inni a'udzubika minal hammi wal hazan.", malay: "Ya Allah, aku berlindung dari rasa sedih dan duka." },
            { id: 20, title: "Doa Terhindar dari Penyakit Berbahaya", category: "Kesihatan", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبَرَصِ وَالْجُنُونِ...", rumi: "Allahumma inni a'udzubika minal barasi wal junun...", malay: "Ya Allah, aku berlindung dari penyakit sopak, gila, dan kusta." },
            { id: 21, title: "Doa Memohon Rezeki Luas", category: "Rezeki", arabic: "اللَّهُمَّ رَبَّنَا أَنْزِلْ عَلَيْنَا مَائِدَةً مِنَ السَّمَاءِ...", rumi: "Allahumma rabbana anzil 'alaina ma'idatan minas-sama'...", malay: "Ya Allah, turunkanlah kepada kami hidangan dari langit..." },
            { id: 22, title: "Doa Terlepas Dari Hutang", category: "Rezeki", arabic: "اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ...", rumi: "Allahummakfini bi halalika 'an haramika...", malay: "Ya Allah, cukupkanlah aku dengan rezeki yang halal..." },
            { id: 23, title: "Doa Mohon Zuriat Soleh", category: "Keluarga", arabic: "رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً...", rumi: "Rabbi hab li min ladunka dzurriyyatan tayyibah...", malay: "Wahai Tuhanku, kurniakanlah kepadaku zuriat keturunan yang baik..." },
            { id: 24, title: "Doa Suami Isteri Harmoni", category: "Keluarga", arabic: "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ", rumi: "Rabbana hab lana min azwajina wa dzurriyyatina qurrata a'yun.", malay: "Ya Tuhan kami, kurniakanlah kepada kami penyejuk mata..." },
            { id: 25, title: "Doa Penawar Sakit / Demam", category: "Kesihatan", arabic: "بِسْمِ اللَّهِ ثَلَاثًا، وَأُعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ...", rumi: "Bismillahi thalathan, wa a'udzubika min syarri ma ajidu...", malay: "Dengan nama Allah (3x), aku berlindung dengan kekuasaan Allah..." },
            { id: 26, title: "Doa Selepas Mendengar Azan", category: "Harian", arabic: "اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ...", rumi: "Allahumma rabba hazihid-da'watit-tammah...", malay: "Ya Allah, Tuhan yang memiliki seruan yang sempurna ini..." },
            { id: 27, title: "Doa Masuk Pasar / Kedai", category: "Harian", arabic: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ...", rumi: "La ilaha illallahu wahdahu la syarika lah...", malay: "Tiada Tuhan selain Allah Yang Esa tiada sekutu bagi-Nya..." },
            { id: 28, title: "Doa Ketika Cermin Muka", category: "Harian", arabic: "الْحَمْدُ لِلَّهِ، اللَّهُمَّ كَمَا أَحْسَنْتَ خَلْقِي فَحَسِّنْ خُلُقِي", rumi: "Alhamdulillah, Allahumma kama ahsanta khalqi fahassin khuluqi.", malay: "Segala puji bagi Allah, ya Allah sebagaimana Engkau elokkan kejadianku..." },
            { id: 29, title: "Doa Masuk Tandas (Alternatif)", category: "Harian", arabic: "بِسْمِ اللَّهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ", rumi: "Bismillah, Allahumma inni a'udzubika minal khubuthi wal khabaa'ith.", malay: "Dengan nama Allah, ya Allah aku berlindung dengan-Mu..." },
            { id: 30, title: "Doa Ketika Marah", category: "Kesihatan", arabic: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", rumi: "A'udzubillahi minasy-syaitanir rajim.", malay: "Aku berlindung kepada Allah dari syaitan yang direjam." },
            { id: 31, title: "Doa Ketika Turun Hujan", category: "Harian", arabic: "اللَّهُمَّ صَيِّبًا نَفِيعًا", rumi: "Allahumma shayyiban nafi'an.", malay: "Ya Allah, turunkanlah hujan yang bermanfaat." },
            { id: 32, title: "Doa Selepas Hujan Rahmat", category: "Harian", arabic: "مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ", rumi: "Mutirna bi fadlillahi wa rahmatih.", malay: "Kami diberi hujan dengan kurnia dan rahmat Allah." },
            { id: 33, title: "Doa Mendengar Petir / Kilat", category: "Harian", arabic: "سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ", rumi: "Subhanalladzii yusabbihur-ra'du bihamdihi wal mala-ikatu min khiifatih.", malay: "Maha Suci Allah yang bertasbih dengan memuji-Nya..." },
            { id: 34, title: "Doa Ziarah Orang Sakit", category: "Kesihatan", arabic: "لَا بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ", rumi: "La ba'sa tahurun in sya' Allah.", malay: "Tidak mengapa, semoga sakit ini membersihkan dosa insya-Allah." },
            { id: 35, title: "Doa Takziah Kematian", category: "Perlindungan", arabic: "إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي", rumi: "Inna lillahi wa inna ilaihi raji'un, Allahumma-jurni fi musibati...", malay: "Sesungguhnya kami milik Allah dan kepada-Nya kami kembali..." },
            { id: 36, title: "Doa Ketika Berbuka Puasa", category: "Harian", arabic: "ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللَّهُ", rumi: "Zahabaz-zama'u wabtallatil 'uruqu, wa tsabatal ajru in sya' Allah.", malay: "Telah hilang dahaga, urat-urat telah basah, dan tetap pahala insya-Allah." },
            { id: 37, title: "Doa Malam Lailatul Qadar", category: "Keampunan", arabic: "اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", rumi: "Allahumma innaka 'afuwwun tuhibbul 'afwa fa'fu 'anni.", malay: "Ya Allah, sesungguhnya Engkau Maha Pemaaf, suka memaafkan, maka maafkanlah aku." },
            { id: 38, title: "Doa Terhindar Dari Sifat Ragu / Syak", category: "Perlindungan", arabic: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا", rumi: "Rabbana la tuzigh qulubana ba'da iz hadaitana.", malay: "Ya Tuhan kami, janganlah Engkau pesongkan hati kami..." },
            { id: 39, title: "Doa Perlindungan Sihir & Hasad", category: "Perlindungan", arabic: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", rumi: "A'udzu bikalimatillahit-tammati min syarri ma khalaq.", malay: "Aku berlindung dengan kalimah Allah yang sempurna dari kejahatan makhluk." },
            { id: 40, title: "Doa Memohon Ketetapan Iman", category: "Perlindungan", arabic: "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ", rumi: "Ya muqallibal qulub tsabbit qalbi 'ala dinik.", malay: "Wahai Tuhan yang membolak-balikkan hati, tetapkan hatiku pada agama-Mu." },
            { id: 41, title: "Doa Ketika Berada di Majlis Ilmu", category: "Rezeki", arabic: "رَبِّ زِدْنِي عِلْمًا وَرْزُقْنِي فَهْمًا", rumi: "Rabbi zidni 'ilman warzuqni fahma.", malay: "Ya Tuhanku, tambahkanlah ilmu kepadaku dan kurniakan kefahaman." },
            { id: 42, title: "Doa Hendak Tidur", category: "Harian", arabic: "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", rumi: "Bismika allahumma amutu wa ahya.", malay: "Dengan nama-Mu ya Allah, aku mati dan aku hidup." },
            { id: 43, title: "Doa Memohon Petunjuk Istikharah", category: "Rezeki", arabic: "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ", rumi: "Allahumma inni astakhiruaka bi 'ilmika wa asta-qdiruka bi qudratik.", malay: "Ya Allah, sesungguhnya aku memohon petunjuk pilihan dengan ilmu-Mu..." },
            { id: 44, title: "Doa Ketika Sulit Urusan", category: "Kesihatan", arabic: "اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا", rumi: "Allahumma la sahla illa ma ja'altahu sahla, wa anta taj'alul hazna idza syi'ta sahla.", malay: "Ya Allah, tiada mudah melainkan apa yang Engkau jadikan mudah..." },
            { id: 45, title: "Doa Selamat Dari Segala Musibah", category: "Perlindungan", arabic: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ", rumi: "Bismillahilladzii la yadurru ma'asmihi syai'un fil-ardi wa la fis-sama'", malay: "Dengan nama Allah yang tiada memudaratkan sesuatu di bumi dan langit..." },
            { id: 46, title: "Doa Mensyukuri Nikmat", category: "Harian", arabic: "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ", rumi: "Rabbi awzi'ni an asykura ni'matakal lati an'amta 'alayya...", malay: "Ya Tuhanku, ilhamkanlah daku supaya tetap bersyukur akan nikmat-Mu..." },
            { id: 47, title: "Doa Menjauhkan Sifat Sombong", category: "Keampunan", arabic: "اللَّهُمَّ طَهِّرْ قَلْبِي مِنَ النِّفَاقِ وَعَمَلِي مِنَ الرِّيَاءِ", rumi: "Allahumma tahhir qalbi minan-nifaqi wa 'amali minar-riya'", malay: "Ya Allah, sucikan hatiku dari sifat munafik dan amalku dari riyak." },
            { id: 48, title: "Doa Mohon Perlindungan Sifat Lemah", category: "Perlindungan", arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ وَالْجُبْنِ وَالْبُخْلِ", rumi: "Allahumma inni a'udzubika minal 'ajzi wal kasali wal jubni wal bukhl", malay: "Ya Allah, aku berlindung dari sifat lemah, malas, pengecut, dan kedekut." },
            { id: 49, title: "Doa Masuk Kampung atau Bandar Asing", category: "Perlindungan", arabic: "اللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ وَما أَظْلَلْنَ... أَسْأَلُكَ خَيْرَ هَذِهِ الْقَرْيَةِ", rumi: "Allahumma rabba-ssamawatis-sab'i wa ma azlalna... as-aluka khaira hazihil qaryah", malay: "Ya Allah Tuhan langit yang tujuh dan apa yang dinaunginya... aku mohon kebaikan bandar ini." },
            { id: 50, title: "Doa Penutup Majlis (Kifarah)", category: "Majlis", arabic: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ", rumi: "Subhanakallahumma wa bihamdika, asyhadu an la ilaha illa anta, astaghfiruka wa atubu ilaik.", malay: "Maha Suci Engkau ya Allah, aku memuji-Mu. Aku bersaksi tiada Tuhan melainkan Engkau, aku mohon keampunan dan bertaubat kepada-Mu." }
        ];

        let favorites = JSON.parse(localStorage.getItem('doa_favorites') || '[]');
        let currentCategory = 'Semua';
        let showOnlyFavs = false;
        let searchQuery = '';
        let activeDoaId = null;

        const doaListEl = document.getElementById('doaList');
        const searchInput = document.getElementById('searchInput');
        const categoriesScroll = document.getElementById('categoriesScroll');
        const emptyState = document.getElementById('emptyState');
        const toast = document.getElementById('toast');
        const filterFavBtn = document.getElementById('filterFavBtn');

        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalBadge = document.getElementById('modalBadge');
        const modalTitle = document.getElementById('modalTitle');
        const modalArabic = document.getElementById('modalArabic');
        const modalRumi = document.getElementById('modalRumi');
        const modalMalay = document.getElementById('modalMalay');
        const modalCopyBtn = document.getElementById('modalCopyBtn');
        const modalFavBtn = document.getElementById('modalFavBtn');

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function renderDoas() {
            let filtered = duasData.filter(d => {
                const matchesCat = showOnlyFavs ? favorites.includes(d.id) : (currentCategory === 'Semua' || d.category === currentCategory);
                const matchesSearch = d.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      d.malay.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      d.rumi.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                doaListEl.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            doaListEl.innerHTML = filtered.map(d => {
                const isFav = favorites.includes(d.id);
                return `
                    <div class="doa-card" onclick="openModal(${d.id})">
                        <div class="doa-header">
                            <div class="doa-title-group">
                                <span class="doa-badge">${d.category}</span>
                                <h3 class="doa-name">${d.title}</h3>
                            </div>
                            <div class="doa-actions">
                                <button class="action-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav(${d.id})" title="Simpan Kegemaran">⭐</button>
                                <button class="action-btn" onclick="event.stopPropagation(); copyDoa('${encodeURIComponent(d.title + '\n\n' + d.arabic + '\n\n' + d.rumi + '\n\n' + d.malay)}')" title="Salin Doa">📋</button>
                            </div>
                        </div>
                        <div class="arabic-text">${d.arabic}</div>
                        <div class="rumi-text-card">Rumi: ${d.rumi}</div>
                        <div class="preview-text">Maksud: ${d.malay}</div>
                    </div>
                `;
            }).join('');
        }

        window.openModal = function(id) {
            const d = duasData.find(item => item.id === id);
            if (!d) return;
            activeDoaId = id;
            modalBadge.textContent = d.category;
            modalTitle.textContent = d.title;
            modalArabic.textContent = d.arabic;
            modalRumi.textContent = d.rumi;
            modalMalay.textContent = d.malay;

            const isFav = favorites.includes(id);
            modalFavBtn.textContent = isFav ? '⭐ Buang Kegemaran' : '⭐ Simpan Kegemaran';

            modalOverlay.classList.add('open');
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        modalCopyBtn.addEventListener('click', () => {
            const d = duasData.find(item => item.id === activeDoaId);
            if (d) {
                copyDoa(encodeURIComponent(d.title + '\n\n' + d.arabic + '\n\n' + d.rumi + '\n\n' + d.malay));
            }
        });

        modalFavBtn.addEventListener('click', () => {
            if (activeDoaId) {
                toggleFav(activeDoaId);
                const isFav = favorites.includes(activeDoaId);
                modalFavBtn.textContent = isFav ? '⭐ Buang Kegemaran' : '⭐ Simpan Kegemaran';
            }
        });

        window.toggleFav = function(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                showToast('Dibuang daripada kegemaran');
            } else {
                favorites.push(id);
                showToast('Disimpan ke kegemaran! ⭐');
            }
            try {
                localStorage.setItem('doa_favorites', JSON.stringify(favorites));
            } catch(e) {}
            renderDoas();
            if (activeDoaId === id) {
                const isFav = favorites.includes(id);
                modalFavBtn.textContent = isFav ? '⭐ Buang Kegemaran' : '⭐ Simpan Kegemaran';
            }
        };

        window.copyDoa = function(encodedText) {
            const text = decodeURIComponent(encodedText);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Berjaya disalin ke papan keratan!');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        };

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('Berjaya disalin ke papan keratan!');
            } catch (e) {
                showToast('Gagal menyalin teks.');
            }
            document.body.removeChild(textarea);
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderDoas();
        });

        categoriesScroll.addEventListener('click', (e) => {
            if (e.target.classList.contains('cat-chip')) {
                document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.cat;
                showOnlyFavs = false;
                filterFavBtn.style.borderColor = 'var(--border)';
                renderDoas();
            }
        });

        filterFavBtn.addEventListener('click', () => {
            showOnlyFavs = !showOnlyFavs;
            if (showOnlyFavs) {
                filterFavBtn.style.borderColor = 'var(--accent)';
                filterFavBtn.style.background = 'rgba(56, 189, 248, 0.2)';
            } else {
                filterFavBtn.style.borderColor = 'var(--border)';
                filterFavBtn.style.background = 'var(--card-bg)';
            }
            renderDoas();
        });

        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const menuAbout = document.getElementById('menuAbout');
        const menuReset = document.getElementById('menuReset');

        if (menuBtn && dropdownMenu) {
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
            });
            document.addEventListener('click', () => {
                dropdownMenu.style.display = 'none';
            });
        }

        if (menuAbout) {
            menuAbout.addEventListener('click', (e) => {
                e.preventDefault();
                dropdownMenu.style.display = 'none';
                alert('Himpunan 50 Doa - PS5 Glass Edition\nKoleksi doa pilihan untuk kegunaan harian.\nDibuat dengan ❤️ oleh Naza Lab.');
            });
        }

        if (menuReset) {
            menuReset.addEventListener('click', (e) => {
                e.preventDefault();
                dropdownMenu.style.display = 'none';
                if (confirm('Adakah anda pasti mahu memadamkan semua senarai doa kegemaran?')) {
                    favorites.clear();
                    saveFavorites();
                    renderDoas();
                    showToast('Semua kegemaran telah diset semula.');
                }
            });
        }

        renderDoas();
    </script>
</body>
</html>
